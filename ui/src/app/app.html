<div class="app-shell" [class.sidebar-collapsed]="sidebarCollapsed()" [class.mobile-menu-open]="mobileMenuOpen()">
  <aside class="sidebar" id="main-navigation" aria-label="Main navigation">
    <a class="brand" routerLink="/dashboard" aria-label="AI Product Demand Analyzer home"><span class="brand-mark" aria-hidden="true">A</span><span class="brand-name">AI Product</span><span class="brand-caption">DEMAND ANALYZER</span></a>
    <div class="nav-label">WORKSPACE</div>
    <nav class="nav-list">
      @for (item of navigation; track item.path) {
        <a class="nav-link" [routerLink]="item.path" routerLinkActive="active" [attr.aria-label]="item.label"><span class="nav-icon" aria-hidden="true">{{ item.icon }}</span><span>{{ item.label }}</span></a>
      }
    </nav>
    <div class="sidebar-footer"><span class="status-dot"></span><span>Analytics workspace</span></div>
  </aside>
  <div class="main-shell">
    <header class="topbar">
      <button class="menu-toggle" type="button" (click)="toggleSidebar()" aria-label="Toggle navigation" aria-controls="main-navigation" [attr.aria-expanded]="mobileMenuOpen() || !sidebarCollapsed()">☰</button>
      <div class="topbar-context"><span>Workspace</span><span class="crumb-divider">/</span><strong>{{ pageTitle() }}</strong></div>
      <div class="topbar-right"><div class="avatar" aria-label="Workspace profile">AD</div></div>
    </header>
    <main id="main-content" class="content-area"><router-outlet /></main>
    <footer class="app-footer"><span>AI Product Demand Analyzer</span><span>Demand planning workspace</span></footer>
  </div>
</div>
