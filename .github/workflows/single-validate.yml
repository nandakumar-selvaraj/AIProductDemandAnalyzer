name: Single application offline validation
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Static security, workflows, scripts and deployment contracts
        run: |
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.76.1 config --exit-code 1 --severity HIGH,CRITICAL /src/compose.prod.yml
          docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color
          bash -n deploy/single/*.sh
          python -m pip install -r infrastructure/requirements-validation.txt
          python -m pytest infra/tests -q
          ruff check infra deploy/single
          ruff format --check infra deploy/single
          python infra/validate.py
          python infrastructure/check_secrets.py
