name: Single app Terraform apply
on:
  workflow_dispatch:
    inputs:
      plan_run_id: {description: Successful reviewed single-app plan run, required: true}
      expected_sha: {description: Exact reviewed master commit SHA, required: true}
      plan_sha256: {description: Reviewed saved-plan SHA256, required: true}
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: aiproductdemand-terraform-production
  cancel-in-progress: false
jobs:
  operation:
    environment: aiproductdemand-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOYMENT_ENVIRONMENT: aiproductdemand-production
      UPCLOUD_TOKEN: ${{ secrets.AIPD_UPCLOUD_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AIPD_TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AIPD_TF_STATE_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AIPD_TF_STATE_REGION }}
      AWS_EC2_METADATA_DISABLED: 'true'
      TF_IN_AUTOMATION: 'true'
      TF_STATE_BUCKET: ${{ vars.AIPD_TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.AIPD_TF_STATE_REGION }}
      TF_STATE_KMS_KEY: ${{ vars.AIPD_TF_STATE_KMS_KEY }}
      TF_STATE_KEY: aiproductdemand/production/terraform.tfstate
      TF_VAR_project_name: aiproductdemand
      TF_VAR_environment: production
      TF_VAR_upcloud_zone: ${{ vars.SINGLE_UPCLOUD_ZONE }}
      TF_VAR_server_plan: ${{ vars.SINGLE_UPCLOUD_PLAN }}
      TF_VAR_server_hostname: aiproductdemand-prod
      TF_VAR_ssh_public_key: ${{ vars.SINGLE_OPERATOR_PUBLIC_KEY }}
      TF_VAR_deploy_ssh_public_key: ${{ vars.SINGLE_DEPLOY_PUBLIC_KEY }}
      TF_VAR_ssh_allowed_cidrs: ${{ vars.SINGLE_SSH_ALLOWED_CIDRS }}
      TF_VAR_server_timezone: Etc/UTC
      TF_VAR_boot_storage_tier: ${{ vars.SINGLE_STORAGE_TIER }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      PLAN_SHA256: ${{ inputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Execute only the protected reviewed operation
        run: python infra/automation.py apply
