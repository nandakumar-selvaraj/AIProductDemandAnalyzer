name: Approved dedicated application deployment
on:
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Successful dedicated image publication run for this exact master commit
        type: string
        required: true
      schema_compatible:
        description: Migrations reviewed as backward compatible with the previous application release
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: aiproductdemand-application-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/master' && inputs.schema_compatible
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.images.outputs.backend }}
      frontend: ${{ steps.images.outputs.frontend }}
      postgres: ${{ steps.images.outputs.postgres }}
      nginx: ${{ steps.images.outputs.nginx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require successful CI on this exact master commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python infra/ci.py
      - name: Verify publication and resolve scanned immutable manifest
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
        run: python infra/release_manifest.py
  deploy:
    needs: build
    environment: aiproductdemand-production
    # Isolated runner with fixed egress; never the production VPS and no internet-wide SSH.
    runs-on: ${{ vars.SINGLE_DEPLOY_RUNNER_LABEL || 'demand-fixed-egress-not-configured' }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOYMENT_ENVIRONMENT: aiproductdemand-production
      SCHEMA_COMPATIBLE: ${{ inputs.schema_compatible }}
      DEPLOY_HOST: ${{ vars.SINGLE_DEPLOY_HOST }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.AIPD_DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.AIPD_DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_HOST_KEY_FINGERPRINT: ${{ vars.SINGLE_DEPLOY_HOST_KEY_FINGERPRINT }}
      BACKEND_IMAGE: ${{ needs.build.outputs.backend }}
      FRONTEND_IMAGE: ${{ needs.build.outputs.frontend }}
      POSTGRES_IMAGE: ${{ needs.build.outputs.postgres }}
      NGINX_IMAGE: ${{ needs.build.outputs.nginx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify protection and CI, then backup, migrate, deploy and check HTTPS
        run: python infra/deploy_transport.py
