[project]
name = "ai-product-demand-analyzer"
version = "0.1.0"
description = "Backend for an AI product demand analyzer"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.16.5", "fastapi==0.119.0", "psycopg[binary]==3.3.6",
  "pydantic-settings==2.11.0", "python-multipart==0.0.20",
  "sqlalchemy==2.0.43", "uvicorn[standard]==0.38.0"
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.4.2", "ruff==0.14.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
