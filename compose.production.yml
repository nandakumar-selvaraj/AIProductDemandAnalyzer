name: ${COMPOSE_PROJECT_NAME:-demand}
x-api: &api
  build: ./backend
  environment:
    ENVIRONMENT: production
    DATABASE_URL: ${DATABASE_URL:?required}
    AUTH_ENABLED: "true"
    JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?required}
    JWT_ISSUER: ${JWT_ISSUER:-ai-product-demand-analyzer}
    JWT_AUDIENCE: ${JWT_AUDIENCE:-demand-analyzer-browser}
    AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?required}
    AUTH_ACCESS_TOKEN_MINUTES: ${AUTH_ACCESS_TOKEN_MINUTES:-30}
    AUTH_LOGIN_REQUESTS_PER_MINUTE: ${AUTH_LOGIN_REQUESTS_PER_MINUTE:-10}
    TRUSTED_HOSTS: ${TRUSTED_HOSTS:?required}
    PUBLIC_DEMO_ENABLED: ${PUBLIC_DEMO_ENABLED:-false}
    DEMO_DATABASE_URL: ${DEMO_DATABASE_URL:-}
    DEMO_AI_ENABLED: ${DEMO_AI_ENABLED:-false}
    DEMO_READS_PER_MINUTE: ${DEMO_READS_PER_MINUTE:-120}
    DEMO_AI_REQUESTS_PER_MINUTE: ${DEMO_AI_REQUESTS_PER_MINUTE:-3}
    DEMO_AI_DAILY_CAP: ${DEMO_AI_DAILY_CAP:-10}
    AI_ENABLED: ${AI_ENABLED:-false}
    AI_PROVIDER: ${AI_PROVIDER:-openai}
    AI_BASE_URL: ${AI_BASE_URL:-}
    AI_MODEL: ${AI_MODEL:-}
    AI_API_KEY: ${AI_API_KEY:-}
    AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
    AI_MAX_CONCURRENT_REQUESTS: ${AI_MAX_CONCURRENT_REQUESTS:-1}
    AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-6}
    AI_USAGE_FILE: /state/ai-usage.sqlite3
    AI_DAILY_REQUEST_CAP: ${AI_DAILY_REQUEST_CAP:-50}
  networks: [private]
  read_only: true
  tmpfs: [/tmp:size=64m,mode=1777]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  mem_limit: 512m
  cpus: 0.75
  pids_limit: 100
  logging: &logging
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD:?required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?required}
    networks: [private]
    volumes:
      - database:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 100
    logging: *logging
  migrate:
    <<: *api
    environment:
      ENVIRONMENT: production
      AUTH_ENABLED: "true"
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?required}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?required}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?required}
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?required}
    command: [alembic, upgrade, head]
    profiles: [tools]
    depends_on:
      db: {condition: service_healthy}
  backend:
    <<: *api
    volumes: [ai_usage:/state]
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./ui
    networks: [private]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=16m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 50
    logging: *logging
  proxy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?required}
      ACME_EMAIL: ${ACME_EMAIL:?required}
    ports: ["80:80", "443:443"]
    networks: [private]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/Caddy.routes:/etc/caddy/app.routes:ro
      - certificates:/data
      - proxy_config:/config
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100
    logging: *logging
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  private:
volumes:
  ai_usage:
  database:
  certificates:
  proxy_config:
