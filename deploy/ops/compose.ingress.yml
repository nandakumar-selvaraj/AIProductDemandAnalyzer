name: portfolio-ingress
services:
  caddy:
    image: ${CADDY_IMAGE:?immutable image required}
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - /etc/portfolio/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/portfolio/sites:/etc/caddy/sites:ro
      - certificates:/data
      - config:/config
    networks: [demand_edge]
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:2019/config/']
      interval: 15s
      timeout: 5s
      retries: 8
volumes:
  certificates:
    name: portfolio_certificates
  config:
    name: portfolio_caddy_config
networks:
  demand_edge:
    external: true
    name: portfolio_demand_edge
