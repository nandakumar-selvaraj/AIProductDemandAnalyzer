# Stage A intentionally serves no application or authentication over HTTP.
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    location = /healthz { access_log off; return 200 "ingress-only; application not public\n"; }
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 503; }
}
