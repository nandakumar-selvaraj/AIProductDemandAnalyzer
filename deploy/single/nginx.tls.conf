# Operator replaces DOMAIN with the validated DNS hostname before installation.
server {
    listen 8080;
    server_name DOMAIN;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 308 https://DOMAIN$request_uri; }
}
server {
    listen 8443 ssl;
    server_name DOMAIN;
    server_tokens off;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 26m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Angular uses inline styles; scripts remain self-only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location /api/ {
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        # Cache-Control: no-store comes from the existing security middleware.
    }
    location / {
        set $ui_upstream http://frontend:8080;
        proxy_pass $ui_upstream;
        proxy_set_header Host $host;
    }
}
